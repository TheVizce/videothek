  if(d.addseries!==undefined){ openSeriesEditor(); return; }
  if(d.editseries){ openSeriesEditor(d.editseries); return; }
  if(d.sf){ const st=S.sf.kind; st.has(d.v)?st.delete(d.v):st.add(d.v); render(); return; }
  if(d.sp){ S.sf.progress=d.sp; render(); return; }
  if(d.continue){ openDrawer(d.continue,true); return; }
  if(d.showvideos){ S.view="videos"; lsSet("vt-view",S.view); for(const k of ["genre","format","creator","tags","mood","status","series"]) S.f[k].clear(); S.f.series.add(d.showvideos); closeLayer(); render(); return; }
  if(d.mv){ moveInSeries(S.openSeries,d.id,+d.mv); return; }
  if(d.rmpart){ const x=S.series.get(S.openSeries); updateSeries(x.id,{videoIds:x.videoIds.filter(i=>i!==d.rmpart)}); toast("Aus der Reihe entfernt"); return; }
  if(d.allwatched!==undefined){ const x=S.series.get(S.openSeries); const all=x.videoIds.every(id=>S.videos.get(id)?.watched); for(const id of x.videoIds){ const v=S.videos.get(id); if(v&&v.watched===all) S.videos.set(id,{...v,watched:!all,updatedAt:Date.now()}); } persist(); render(); return; }
  if(d.syncpl!==undefined){ syncPlaylist(S.openSeries); return; }
  if(d.sdel!==undefined){ S.confirmSDel=true; renderSeriesDrawer(); return; }
  if(d.sdelNo!==undefined){ S.confirmSDel=false; renderSeriesDrawer(); return; }
  if(d.sdelYes!==undefined){ const id=S.openSeries; closeLayer(); S.series.delete(id); S.deletedSeries.add(id); S.f.series.delete(id); persist(); render(); toast("Reihe gelöscht, Videos bleiben erhalten"); return; }
  if(d.sedpick){ ES.pick.push(d.sedpick); ES.q=""; renderSedList(); $("#se-q").value=""; renderSedRes(); return; }
  if(d.sedrm){ ES.pick=ES.pick.filter(x=>x!==d.sedrm); renderSedList(); return; }
  if(d.loadpl!==undefined){ loadPlaylistInEditor(); return; }
  if(d.findorig!==undefined){ t.disabled=true; t.textContent="Suche …"; suggestOriginals(); return; }
  if(d.sugg){ pickSuggestion(d.sugg); return; }
  if(d.asrx!==undefined){ const f=$("#e-format"); let o=[...f.options].find(o=>isRxFormat(o.value)); if(!o){ o=new Option("Reaction","Reaction"); f.add(o); } f.value=o.value; selHint(f); t.remove(); renderRx(); $("#e-rx").scrollIntoView({block:"nearest"}); return; }
  if(d.clearkind!==undefined){ S.sf.kind.clear(); render(); return; }
  if(d.addseriesWith){ openSeriesEditor(null,{pick:[d.addseriesWith]}); return; }
  if(d.importpl){ openPlaylistImport(d.importpl); return; }
  if(d.plimport!==undefined){ openPlaylistImport(); return; }
  if(d.piload!==undefined){ piLoad(); return; }
  if(d.pisel){ PI.sel=new Set(d.pisel==="all"?PI.pl.ids.filter(id=>!S.videos.has(id)):[]); piList(); piCount(); return; }
  if(d.settings!==undefined){ openSettings(); return; }
  if(d.retry!==undefined){ S.dirty?push():pull(); return; }
  if(d.open){ openDrawer(d.open); return; }
  if(d.play!==undefined){ S.playing=true; $(".player").innerHTML=""; renderDrawer(); return; }
  if(d.f){ const s=S.f[d.f]; s.has(d.v)?s.delete(d.v):s.add(d.v); render(); return; }
  if(d.clear){ S.f[d.clear].clear(); render(); return; }
  if(d.w){ S.f.watched=d.w; render(); return; }
  if(d.rm){ S.f[d.rm].delete(d.v); render(); return; }
  if(d.rmw!==undefined){ S.f.watched="all"; render(); return; }
  if(d.clearall!==undefined){ clearVideoFilters(); S.sf.kind.clear(); S.sf.progress="all"; S.q=""; $("#q").value=""; render(); return; }
  if(d.tagfilter){ S.f.tags.add(d.tagfilter); closeLayer(); render(); return; }
  if(d.edit){ openEditor(d.edit); return; }
  if(d.toggleWatched!==undefined){ const v=S.videos.get(S.openId); updateVideo(v.id,{watched:!v.watched}); toast(v.watched?"Als ungesehen markiert":"Als gesehen markiert"); return; }
  if(d.del!==undefined){ S.confirmDel=true; renderDrawer(); return; }
  if(d.delNo!==undefined){ S.confirmDel=false; renderDrawer(); return; }
  if(d.delYes!==undefined){ const id=S.openId; closeLayer(); removeVideo(id); toast("Gelöscht"); return; }
  if(d.rmtag){ E.tags=E.tags.filter(x=>x!==d.rmtag); renderTags(); return; }
  if(d.addtag){ addTag(d.addtag); return; }
  if(d.pickrx){ E.reactsTo.push(d.pickrx); E.rxQ=""; const msg=inheritFrom(S.videos.get(d.pickrx)); renderTags(); renderRx(); if(msg) $("#e-rxmsg").textContent=msg; $("#e-rxq").focus(); return; }
  if(d.newrx){ E.stubs.set(d.newrx,{id:d.newrx,title:"",creator:"",tags:[],reactsTo:[],status:"Verfügbar",watched:false,addedAt:Date.now()}); E.reactsTo.push(d.newrx); E.rxQ=""; renderRx(); return; }
  if(d.rmrx){ E.reactsTo=E.reactsTo.filter(x=>x!==d.rmrx); renderRx(); return; }
});
$("#addBtn").addEventListener("click",()=>S.view==="series"?openSeriesEditor():S.view==="feed"?openChannels():openEditor());
function setView(v){
  if(S.view==="feed"&&v!=="feed") lsSet(LS_FEEDSEEN,Date.now());
  if(v==="feed"&&S.view!=="feed") F.seenPrev=lsGet(LS_FEEDSEEN,0);
  S.view=v; lsSet("vt-view",v); closeLayer(); render();
  if(v==="feed"&&S.cfg.ytKey&&S.channels.size&&Date.now()-F.fetchedAt>30*6e4) refreshFeed();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&S.view==="feed") lsSet(LS_FEEDSEEN,Date.now()); });
document.addEventListener("input",e=>{ if(e.target.closest?.(".chbody")&&e.target.dataset.k&&e.target.type!=="checkbox"&&e.target.tagName!=="SELECT") onChannelField(e.target);
  if(e.target.id==="chQ"){ F.chQ=e.target.value; F._focus=true; renderFeedRail(); F._focus=false; } });
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.closest?.(".chbody")&&t.dataset.k&&(t.type==="checkbox"||t.tagName==="SELECT")) onChannelField(t);
  if(t.id==="feedHiddenToggle"){ F.showHidden=t.checked; render(); }
  if(t.id==="pi-series") piCount();
  if(t.matches?.("select[data-lk]")) selHint(t);
  if(t.dataset.sw){ const v=S.videos.get(t.dataset.sw); if(v) updateVideo(v.id,{watched:t.checked}); }
  if(t.id==="addToSeries"&&t.value){ const vid=S.openId;
    if(t.value==="__new") openSeriesEditor(null,{pick:[vid]});
    else { const x=S.series.get(t.value); if(x&&!x.videoIds.includes(vid)) updateSeries(x.id,{videoIds:[...x.videoIds,vid]}); toast(`Zu „${x.name}“ hinzugefügt`); } }
});
$("#listsBtn").addEventListener("click",()=>openLists());
$("#settingsBtn").addEventListener("click",openSettings);
$("#sync").addEventListener("click",()=>{ if(S.syncState==="err") (S.dirty?push():pull()); else openSettings(); });
$("#filterToggle").addEventListener("click",()=>$("#rail").classList.toggle("open"));
$("#q").addEventListener("input",e=>{ S.q=e.target.value.trim(); if(S.view==="series"){ renderSeriesActive(); renderSeriesGrid(); } else if(S.view==="feed"){ renderFeedActive(); renderFeedGrid(); } else { renderActive(); renderGrid(); } });
$("#sort").value=S.sort;
$("#sort").addEventListener("change",e=>{ S.sort=e.target.value; lsSet("vt-sort",S.sort); renderGrid(); });
$("#rail").addEventListener("change",e=>{ if(e.target.id==="inclRx"){ S.f.inclRx=e.target.checked; lsSet("vt-inclrx",S.f.inclRx); render(); } });
$("#rail").addEventListener("input",e=>{ if(e.target.id==="creatorQ"){ S.creatorQ=e.target.value; S._focusCreator=true; renderRail(); S._focusCreator=false; } });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#layer2").innerHTML) closeHelp(); else if($("#layer").innerHTML) closeLayer(); }
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$("#layer").innerHTML){ e.preventDefault(); $("#q").focus(); } });
document.addEventListener("paste",e=>{ // YouTube-URL irgendwo einfügen → direkt neues Video
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||$("#layer").innerHTML) return;
  const txt=(e.clipboardData?.getData("text")||"").trim(); if(!/youtu/.test(txt)) return;
  const items=parseBulk(txt).filter(x=>!x.bad);
  if(items.length>1||(items.length===1&&items[0].p)){ e.preventDefault(); openBulk(txt); }
  else if(items.length===1){ e.preventDefault(); openEditor(null,txt); } });
new MutationObserver(()=>document.body.classList.toggle("has-drawer",!!$("#layer .drawer"))).observe($("#layer"),{childList:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&GH.ready()&&!pushing&&!S.dirty) pull({quiet:true}); });
window.addEventListener("beforeunload",e=>{ if(S.dirty&&GH.ready()){ push(); e.preventDefault(); e.returnValue=""; } });
// Link mit ?add=URL (z. B. per Lesezeichen) öffnet direkt das Formular
const addParam=new URLSearchParams(location.search).get("add");

/* ================= Start ================= */
(function start(){
  const cache=lsGet(LS_CACHE,null);
  if(cache&&cache.data&&(!GH.ready()||cache.repoKey===repoKey()||!cache.repoKey)){
    applyData(cache.data); S.sha=cache.sha||null; S.dirty=!!cache.dirty; S.deleted=new Set(cache.deleted||[]); S.deletedSeries=new Set(cache.deletedSeries||[]); S.deletedChannels=new Set(cache.deletedChannels||[]); S.unhidden=new Set(cache.unhidden||[]);
    S.loaded=true;
  }
  if(!GH.ready()) S.loaded=true;
  setSync(); showNotice(); render();
  const feedAuto=()=>{ if(S.view==="feed"&&S.cfg.ytKey&&S.channels.size&&Date.now()-F.fetchedAt>30*6e4) refreshFeed(); };
  if(GH.ready()) pull({quiet:!!cache}).then(()=>{ if(S.dirty) push(); feedAuto(); }); else feedAuto();
  if(addParam&&parseId(addParam)){ history.replaceState(null,"",location.pathname); openEditor(null,addParam); }
})();
</script>
</body>
