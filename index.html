<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Videothek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Archiv-Regal. Oben Leiste mit Suche, links Filter-Register, rechts Raster; Details als Seitenschublade. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#e3e6eb; --ink:#161a22; --muted:#5d6574; --line:#d3d8e0;
  --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#fde4d6;
  --ok:#2b8a3e; --warn:#a61e4d;
  --cover-l:46%; --cover-s:38%;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12151b; --surface:#1b2028; --sunk:#232935; --ink:#e8ebf0; --muted:#98a1b0; --line:#2f3644;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2216; --ok:#69db7c; --warn:#f783ac;
  --cover-l:34%; --cover-s:32%; color-scheme:dark}}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.top-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:2400px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.brand .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.search{flex:1 1 260px;max-width:440px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:12px;padding:6px 8px;border-radius:var(--r)}
.sync:hover{background:var(--sunk)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite} .sync.err i{background:var(--warn)} .sync.err{color:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.only-narrow{display:none}

.main{display:grid;grid-template-columns:clamp(220px,14vw,290px) minmax(0,1fr);gap:clamp(24px,2vw,40px);max-width:2400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.rail{display:flex;flex-direction:column;gap:20px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.facet h3{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.facet h3 button{border:0;background:none;color:var(--accent);font:inherit;padding:0;text-transform:none;letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:5px 8px;border-radius:4px;color:var(--ink)}
.opt:hover{background:var(--sunk)}
.opt.on{background:var(--accent-soft);font-weight:600}
.opt .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.opt span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}
button.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:6px 4px;font-size:12px}
.seg button.on{background:var(--ink);color:var(--bg)}
.small-in{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:13px;margin-bottom:6px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:28px}
.active .chip{background:var(--accent-soft);border-color:transparent}
.active .chip button{border:0;background:none;padding:0;color:var(--muted);line-height:1}
.sort{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.sort select{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:5px 6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;min-width:0}
.card:hover .cover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.card.gone .cover img{filter:grayscale(1);opacity:.5}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;width:100%;border-radius:var(--r);overflow:hidden;transition:transform .15s,box-shadow .15s;
  background:hsl(var(--h) var(--cover-s) var(--cover-l));color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px 32px}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px)}
.cover > *{position:relative}
.cover > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .ini{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover .ttl{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.badges{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:2}
.badge{font-family:var(--f-mono);font-size:11px;background:rgba(0,0,0,.78);color:#fff;padding:1px 6px;border-radius:3px}
.tl{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:2}
.badge.rx{background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta .t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}

.empty{border:1.5px dashed var(--line);border-radius:10px;padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:22px;margin:0;text-wrap:balance}
.empty p{max-width:46ch;margin:0}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--dw);background:var(--surface);z-index:21;display:flex;flex-direction:column;
  border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-family:var(--f-display);font-size:15px;margin:0;color:var(--muted);font-weight:600}
.drawer-body{overflow:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:18px}
.player{position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .cover{border-radius:0;height:100%}
.play{position:absolute;inset:0;border:0;background:none;display:flex;align-items:center;justify-content:center;z-index:3}
.play span{width:64px;height:46px;border-radius:12px;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;transition:background .15s}
.play:hover span{background:var(--accent)}
.dtitle{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:8px}
dl.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;margin:0}
dl.props dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:2px}
dl.props dd{margin:0;min-width:0}
.notes{white-space:pre-wrap;background:var(--bg);border-radius:var(--r);padding:12px 14px;margin:0}
.sec h4{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.linklist{display:flex;flex-direction:column;gap:6px}
.mini{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px;text-align:left;width:100%}
button.mini:hover{border-color:var(--muted)}
.mini .cover{padding:0;border-radius:3px}
.mini .cover .ini,.mini .cover .ttl{display:none}
.mini b{display:block;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini small{color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:10px 12px;border-radius:var(--r)}

.modal{position:fixed;z-index:22;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 32px) 32px}
.sheet{background:var(--surface);border-radius:10px;width:min(680px,100%);box-shadow:0 20px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-size:19px;margin:0}
.sheet-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-body h3{font-family:var(--f-display);font-size:16px;margin:6px 0 -6px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > label:not(.check),.f .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.f input[type=text],.f input[type=url],.f input[type=date],.f input[type=password],.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.f textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.hint.err{color:var(--warn)} .hint.ok{color:var(--ok)}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0}
.tagbox{display:flex;flex-wrap:wrap;gap:5px;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);align-items:center}
.tagbox input{flex:1;min-width:120px;border:0;background:transparent;padding:4px}
.tagbox input:focus{outline:none}
.tagbox:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.tagbox .chip button{border:0;background:none;padding:0;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg .chip{border-style:dashed}
.check{display:flex;gap:8px;align-items:center;padding-top:6px}
.rxbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.rxres{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.rxsel{display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;font-weight:500}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar-left{display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-width:0}
.stack{position:relative;padding-top:9px;width:100%}
.stack::before,.stack::after{content:"";position:absolute;top:0;height:14px;border-radius:6px 6px 0 0;background:hsl(var(--h) calc(var(--cover-s) - 10%) calc(var(--cover-l) + 22%))}
.stack::before{left:9%;right:9%}
.stack::after{left:4%;right:4%;top:4px;background:hsl(var(--h) calc(var(--cover-s) - 5%) calc(var(--cover-l) + 11%))}
.stack .cover{z-index:1}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.big{height:6px;border-radius:3px}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center}
.part .num{font-size:12px;color:var(--muted);text-align:right}
.part.done .mini b{color:var(--muted);font-weight:500}
.pact{display:flex;align-items:center;gap:2px}
.pact button{border:0;background:none;padding:4px 6px;border-radius:4px;color:var(--muted);line-height:1}
.pact button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.pact button:disabled{opacity:.3;cursor:default}
.pact input{margin:0 6px}
.seriesnav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.seriesnav .lk{border:0;background:none;padding:0;text-align:left;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seriesnav .lk:hover{color:var(--accent)}
.seriesnav small{display:block;color:var(--muted);font-weight:400}
.stat{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.plbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.desc{white-space:pre-wrap;margin:0;color:var(--ink);max-height:9.5em;overflow:auto}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-mono);line-height:18px}
.feedbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.dayhead{font-family:var(--f-display);font-size:18px;margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayhead:first-of-type{margin-top:8px}
.fcard{gap:8px}
.fopen{border:0;background:none;padding:0;width:100%;display:block;text-align:left}
.fopen:hover .cover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.factions{display:flex;gap:4px;flex-wrap:wrap}
.factions .btn{padding:5px 9px;font-size:13px}
.chrow{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chrow summary{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 12px;cursor:pointer;list-style:none}
.chrow summary::-webkit-details-marker{display:none}
.chrow summary::before{content:"›";color:var(--muted);transition:transform .15s;display:inline-block;margin-right:2px}
.chrow[open] summary::before{transform:rotate(90deg)}
.chrow .chname{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow summary .hint{text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbody{padding:4px 12px 12px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.sugbox{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--accent);border-radius:var(--r)}
.sugbox .rxsel .mini{flex:1}
.pilist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px;background:var(--bg)}
.pirow{display:grid;grid-template-columns:auto 24px 72px minmax(0,1fr);gap:8px;align-items:center;padding:4px;border-radius:4px;cursor:pointer}
.pirow:hover{background:var(--sunk)}
.pirow.off{opacity:.55}
.pirow .cover{padding:0;border-radius:3px}
.pirow .cover .ini,.pirow .cover .ttl{display:none}
.pirow b{display:block;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pirow small{color:var(--muted)}
.pirow .num{font-size:12px;color:var(--muted);text-align:right}
.optrow{display:flex;align-items:center;gap:2px}
.optrow .opt{flex:1;min-width:0}
.star{border:0;background:none;padding:3px 6px;border-radius:4px;color:var(--muted);font-size:15px;line-height:1}
.star:hover{background:var(--sunk);color:var(--ink)}
.star.on,.favmark{color:#e8a317}
.chrow summary .star{margin:-3px 0}
.follow{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
html{--dw:min(560px,100%)}
@media (min-width:1280px){html{--dw:clamp(560px,34vw,900px)}}
@media (min-width:1500px){
  body.has-drawer #layer .scrim{display:none}
  body.has-drawer .top,body.has-drawer .main{padding-right:calc(var(--dw) + 24px)}
  .drawer{box-shadow:-16px 0 40px -28px rgba(0,0,0,.45)}
}
@media (min-width:1800px){.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px 20px}.sheet{width:min(760px,100%)}}
.lblrow{display:flex;align-items:center;gap:6px}
.lblrow label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.qbtn{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1;padding:0;color:var(--muted);font-weight:600;flex:none}

<script>
"use strict";
const STATUSES = ["Verfügbar","Nicht mehr verfügbar","Privat"];
/* ================= Empfohlene Einteilung & Einordnungshilfe ================= */
const RECOMMENDED = {
  moodLabel:"Anspruch",
  genres:["Politik & Gesellschaft","Wirtschaft & Geld","Kultur & Medien","Tech & Digitales","Wissenschaft & Geschichte","Sport","Gaming","Comedy & Spaß","Alltag & Lifestyle","Sonstiges"],
  formats:["Video-Essay","Doku & Reportage","Erklärvideo","Kommentar & Review","Reaction","Gespräch & Podcast","Highlights & Clips","Show & Sketch","Vlog & Stream","Tutorial"],
  moods:["Nebenbei","Zurücklehnen","Konzentriert"],
  desc:{
    genres:{
      "Politik & Gesellschaft":"Wie wir zusammenleben und wer darüber entscheidet.\nDazu: Parteien, Wahlen, Gesetze, Außenpolitik, aktuelle Kriege und Konflikte, soziale Fragen, Migration, Klima als politisches Thema, Justiz, Kriminalfälle und True Crime, Satire über Politik.\nNicht: Firmen, Märkte und Geld ohne politischen Streit → Wirtschaft & Geld · abgeschlossene historische Ereignisse → Wissenschaft & Geschichte · Streit unter Creatorn → Kultur & Medien.\nFaustregel: Würde es in den Politik- oder Gesellschaftsteil einer Zeitung gehören?",
      "Wirtschaft & Geld":"Unternehmen, Märkte und das eigene Geld.\nDazu: Firmengeschichten („Warum ging X pleite?“), Börse, Inflation, Immobilien, Arbeitswelt, Karriere, Konsum, Marketing, persönliche Finanzen.\nNicht: Steuern oder Wirtschaftspolitik als Parteienstreit → Politik & Gesellschaft · Produkte von Tech-Firmen → Tech & Digitales.",
      "Kultur & Medien":"Werke, Medien und das Internet als Kulturraum.\nDazu: Film, Serien, Bücher, Musik, Kunst, Design, Journalismus und Medienkritik, Internetkultur, Memes, YouTube- und Creator-Szene, Influencer-Drama.\nNicht: Videospiele → Gaming · Werbung als Geschäft → Wirtschaft & Geld · Technik hinter Plattformen → Tech & Digitales.",
      "Tech & Digitales":"Geräte, Software und wie das Digitale funktioniert.\nDazu: Hardware, Smartphones, Software, KI, Internet und Datenschutz, IT-Sicherheit, Programmieren, Elektroautos, Raumfahrttechnik, Tests und Vergleiche.\nNicht: Social-Media-Trends → Kultur & Medien · Spiele selbst → Gaming (Gaming-Hardware bleibt hier) · Gesetzgebung zu Tech als Parteistreit → Politik & Gesellschaft.",
      "Wissenschaft & Geschichte":"Die Welt verstehen: wie sie funktioniert und wie sie wurde.\nDazu: Naturwissenschaften, Medizin und Forschung, Psychologie, Philosophie, Weltall, Natur und Tiere, Geografie, Sprache, Geschichte, Archäologie.\nNicht: aktuelle Politik zu Wissenschaftsthemen → Politik & Gesellschaft · Gesundheitstipps für den Alltag → Alltag & Lifestyle.\nFaustregel Geschichte: Liegt das Ereignis abgeschlossen in der Vergangenheit (grob mehr als 20 Jahre), gehört es hierher, auch wenn es politisch ist.",
      "Sport":"Wettkampfsport und alles drumherum.\nDazu: Spiele und Highlights, Analysen, Transfers, Sportlerporträts, Sportgeschichte, Ligen und Verbände.\nNicht: E-Sport → Gaming · eigenes Training und Fitness → Alltag & Lifestyle.",
      "Gaming":"Videospiele und ihre Szene.\nDazu: Let's Plays, Spiele-Reviews, Spielegeschichte, E-Sport, Speedruns, Branchennews, Modding.\nNicht: Tests von Konsolen, PCs und Grafikkarten → Tech & Digitales · Brett- und Kartenspiele → Alltag & Lifestyle.",
      "Comedy & Spaß":"Unterhaltung, bei der es kein eigentliches Thema gibt.\nDazu: Sketche, Stand-up, Pranks, Challenges, Fails, Meme-Compilations, absurder Quatsch.\nNicht: Satire über Politik → Politik & Gesellschaft · lustige Videos über Spiele → Gaming. Humor allein entscheidet nicht über das Genre.\nFaustregel: Nur wählen, wenn du nicht sagen kannst, worum es geht, außer „um lustig zu sein“.",
      "Alltag & Lifestyle":"Das eigene Leben: zu Hause, unterwegs, im Körper.\nDazu: Kochen und Essen, Reisen, Wohnen, Heimwerken und DIY, Gesundheit, Fitness, Beziehungen, Produktivität, Mode, persönliche Vlogs, Brett- und Kartenspiele.\nNicht: Ernährung oder Medizin als Forschung → Wissenschaft & Geschichte · Reisen als Geschichtsthema → Wissenschaft & Geschichte.",
      "Sonstiges":"Nur wenn wirklich kein anderes Genre passt.\nPrüfe ab und zu, was hier liegt: Sammeln sich mehr als etwa fünf Videos zum selben Thema, bekommt es ein eigenes Genre."
    },
    formats:{
      "Video-Essay":"Eine Person entwickelt einen Gedankengang oder eine These, mit Skript und Montage.\nErkennbar an: Autorenstimme, Archivmaterial und Grafiken, „Warum …“- oder „Wie … wurde“-Titel, oft 20 bis 90 Minuten.\nNicht: erklärt neutral ohne eigene These → Erklärvideo · eigene Recherche vor Ort mit Interviews → Doku & Reportage · spontane Meinung ohne Skript → Kommentar & Review.",
      "Doku & Reportage":"Journalistische Recherche mit Dreh und mehreren Stimmen.\nErkennbar an: Aufnahmen vor Ort, O-Töne und Interviews, Protagonisten, die man begleitet. Auch TV-Dokus und Reportagen auf YouTube.\nNicht: eine Person erzählt aus dem Off mit Archivmaterial → Video-Essay.",
      "Erklärvideo":"Erklärt neutral, wie etwas funktioniert oder was etwas ist.\nErkennbar an: Ziel ist Verstehen, oft animiert oder mit Moderation, meist 5 bis 20 Minuten, wenig Meinung.\nNicht: Ziel ist, etwas selbst zu machen → Tutorial · klare These und Argumentation → Video-Essay.",
      "Kommentar & Review":"Jemand bezieht Stellung oder bewertet etwas.\nDazu: Meinungsvideos zu aktuellen Themen, Rants, Hot Takes, Film-, Buch-, Spiele- und Produkt-Reviews.\nErkennbar an: wenig Schnitt, Person spricht in die Kamera, oft schnell veraltet.\nNicht: das Original läuft im Video mit → Reaction · lange Argumentation mit Skript und Recherche → Video-Essay.",
      "Reaction":"Das Original läuft im Video (ganz oder in großen Teilen) und jemand reagiert darauf, live oder geschnitten.\nImmer Reaction, auch wenn viel analysiert wird. Verknüpfe das Original oder markiere es als „kein YouTube-Video“.\nNicht: es werden nur kurze Ausschnitte als Beleg gezeigt → Kommentar & Review oder Video-Essay.",
      "Gespräch & Podcast":"Menschen reden miteinander, das Gespräch ist der Inhalt.\nDazu: Interviews, Podcasts, Talkshows, Diskussionsrunden, Q&As.\nNicht: Mitschnitt eines Streams mit Chat → Vlog & Stream.",
      "Highlights & Clips":"Zusammenschnitte ohne eigenen Erzählbogen.\nDazu: Spiel-Highlights, Best-ofs, Compilations, Ausschnitte aus Streams oder Sendungen, Trailer, Supercuts.\nNicht: Ausschnitt mit eigener Einordnung → Kommentar & Review.",
      "Show & Sketch":"Inszenierte Unterhaltung und Auftritte.\nDazu: Sketche, Spielshows, Challenges, Satire-Sendungen, Stand-up, Musikvideos und Konzerte.\nNicht: ungeplanter Alltag → Vlog & Stream.",
      "Vlog & Stream":"Persönlich und wenig geschnitten.\nDazu: Alltags- und Reise-Vlogs, Livestream-Aufzeichnungen, Let's Plays, „Komm mit“-Videos.\nNicht: geplantes Gespräch → Gespräch & Podcast · inszenierte Show → Show & Sketch.",
      "Tutorial":"Anleitung zum Selbermachen.\nDazu: Rezepte, Software-Anleitungen, Reparatur, DIY, Workouts zum Mitmachen, Lernvideos mit Übungen.\nFaustregel: Würdest du beim Schauen mitmachen oder pausieren, um es nachzumachen? Dann Tutorial."
    },
    moods:{
      "Nebenbei":"Muss nicht angeschaut werden: läuft gut beim Kochen, Aufräumen oder Spielen.\nWenn du kurz abgelenkt bist, verpasst du nichts Wichtiges. Ersetzt einen Podcast.\nTypisch: Gespräche, Vlogs, Streams, Highlights, viele Kommentare.",
      "Zurücklehnen":"Hinschauen lohnt sich, ist aber leicht verdaulich.\nIdeal abends auf dem Sofa: Bilder gehören dazu, du folgst ohne Anstrengung.\nTypisch: Dokus, Shows, gut gemachte Erklärvideos, die meisten Reactions.",
      "Konzentriert":"Dichtes Material, das volle Aufmerksamkeit braucht.\nAm besten ausgeruht; eventuell pausieren, zurückspulen, nachdenken.\nTypisch: lange Video-Essays, komplexe Analysen, Wissenschaft, Philosophie."
    }
  }
};
const GUIDE_RULES=[
  ["Ein Feld, eine Frage","Genre: Worum geht es? · Format: Wie ist es gemacht? · Anspruch: Wie viel Aufmerksamkeit braucht es? · Tags: Wer und was genau?"],
  ["Das Video zählt, nicht der Kanal","Ein Tech-Kanal kann ein Wirtschaftsvideo machen. Ordne jedes Video für sich ein. Standardwerte pro Kanal oder Reihe sind nur ein Startpunkt."],
  ["Bei zwei Kandidaten","Nimm den Wert, unter dem du das Video später suchen würdest. Der zweite Aspekt kommt als Tag dazu."],
  ["Reactions","Format ist immer Reaction. Das Genre richtet sich nach dem Thema des Originals und wird beim Verknüpfen übernommen."],
  ["Humor entscheidet nicht","Satire über Politik ist Genre Politik & Gesellschaft mit Format Show & Sketch. Comedy & Spaß nur, wenn es sonst kein Thema gibt."],
  ["Lieber leer als falsch","Wenn du unsicher bist, lass das Feld leer und ergänze es später. Über die Filter findest du Videos ohne Wert schnell wieder."]
];
const GUIDE_TAGS=[
  "Kleingeschrieben, Einzahl, ohne #: „ki“, „bundestagswahl“, „elektroauto“.",
  "Konkretes statt Allgemeines: Personen, Teams, Orte, Werke, Ereignisse und Unterthemen.",
  "Nichts doppeln, was Genre, Format oder Creator schon sagen: kein Tag „politik“, „reaction“ oder Kanalname.",
  "2 bis 5 Tags pro Video. Bevor du einen neuen Tag anlegst, schau in die Vorschläge.",
  "Namen immer gleich schreiben: voller Name („olaf scholz“), Abkürzung nur, wenn sie gängiger ist („nato“, „ki“).",
  "Mehrteilige Projekte sind eine Reihe, kein Tag.",
  "Wenn dir die Gefühlslage wichtig ist, nutze wenige feste Tags dafür, z. B. „lustig“, „bedrückend“, „aufregend“."
];
/* Alte Werte, die sich eindeutig zuordnen lassen. Alles andere bleibt stehen und wird als „alt“ markiert. */
const RECOMMENDED_MAP={
  genre:{"Politik & Gesellschaft":"Politik & Gesellschaft","Politik":"Politik & Gesellschaft","Tech & Digitales":"Tech & Digitales","Tech":"Tech & Digitales",
    "Kultur & Medien":"Kultur & Medien","Medien":"Kultur & Medien","Musik":"Kultur & Medien","Wissen & Einordnung":"Wissenschaft & Geschichte","Wissen":"Wissenschaft & Geschichte",
    "Gaming":"Gaming","Sonstiges":"Sonstiges"},
  format:{"Reaction":"Reaction","Tutorial":"Tutorial","Interview / Podcast":"Gespräch & Podcast","Interview":"Gespräch & Podcast","Podcast":"Gespräch & Podcast",
    "Kommentar / Analyse":"Kommentar & Review","Kommentar":"Kommentar & Review","Essay":"Video-Essay","Doku":"Doku & Reportage","Compilation":"Highlights & Clips"},
  mood:{"Leicht":"Nebenbei","Mittel":"Zurücklehnen","Anspruchsvoll":"Konzentriert"}
};
const moodLabel=()=>S.lists.moodLabel||"Stimmung";
const LIST_KEYS=[["genres","genre","Genre"],["formats","format","Format"],["moods","mood",null]];
function descOf(listKey,val){ return S.lists.desc?.[listKey]?.[val]||""; }
const firstLine=t=>(t||"").split("\n")[0];
const isRxFormat=f=>/reaction|reaktion/i.test(f||"");
const isReaction=v=>isRxFormat(v.format)||(v.reactsTo||[]).length>0||!!v.extOrig;
function fmtGuideText(t){
  return esc(t).split("\n").map((line,i)=>{
    if(i===0) return `<p class="g-sum">${line}</p>`;
    const m=line.match(/^(Dazu|Nicht|Erkennbar an|Typisch|Faustregel[^:]*|Immer[^:]*):\s?(.*)$/);
    return m?`<p><b>${m[1]}:</b> ${m[2].replace(/→ ([^·]+)/g,'→ <em>$1</em>')}</p>`:`<p>${line}</p>`;
  }).join("");
}

const DEFAULT_LISTS={genres:[...RECOMMENDED.genres],formats:[...RECOMMENDED.formats],moods:[...RECOMMENDED.moods],moodLabel:RECOMMENDED.moodLabel,desc:structuredClone(RECOMMENDED.desc)};

const LS_CFG="vt-config", LS_CACHE="vt-cache";

/* ================= Speicher: GitHub + lokaler Cache ================= */
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

function b64ToUtf8(b64){ const bin=atob(b64.replace(/\s/g,"")); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function utf8ToB64(str){ const bytes=new TextEncoder().encode(str); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin); }

const GH = {
  cfg(){ return S.cfg; },
  ready(){ const c=S.cfg; return !!(c.owner&&c.repo&&c.token); },
  url(){ const c=S.cfg; return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`; },
  headers(extra={}){ return {"Authorization":"Bearer "+S.cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...extra}; },
  async read(){
    const r=await fetch(this.url()+"?ref="+encodeURIComponent(S.cfg.branch)+"&t="+Date.now(),{headers:this.headers(),cache:"no-store"});
    if(r.status===404){ // Datei fehlt noch oder Repo nicht gefunden
      const repo=await fetch(`https://api.github.com/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`,{headers:this.headers(),cache:"no-store"});
      if(!repo.ok) throw ghErr(repo.status,"repo");
      return {sha:null,data:null};
    }
    if(!r.ok) throw ghErr(r.status);
    const j=await r.json();
    let text;
    if(j.content) text=b64ToUtf8(j.content);
    else { // > 1 MB: Rohinhalt separat holen
      const raw=await fetch(this.url()+"?ref="+encodeURIComponent(S.cfg.branch),{headers:this.headers({"Accept":"application/vnd.github.raw+json"}),cache:"no-store"});
      if(!raw.ok) throw ghErr(raw.status); text=await raw.text();
    }
    let data; try{ data=JSON.parse(text); }catch(e){ throw {msg:`${S.cfg.path} im Repo ist kein gültiges JSON. Korrigiere oder lösche die Datei auf GitHub.`}; }
    return {sha:j.sha,data};
  },
  async write(data,sha){
    const body={message:"Videothek aktualisiert",content:utf8ToB64(JSON.stringify(data,null,1)),branch:S.cfg.branch};
    if(sha) body.sha=sha;
    const r=await fetch(this.url(),{method:"PUT",headers:this.headers({"Content-Type":"application/json"}),body:JSON.stringify(body)});
    if(r.status===409||r.status===422) throw {conflict:true};
    if(!r.ok) throw ghErr(r.status);
    const j=await r.json(); return j.content.sha;
  }
};
function ghErr(status,what){
  const m={401:"Das GitHub-Token ist ungültig oder abgelaufen. Trag in den Einstellungen ein neues ein.",
    403:"GitHub verweigert den Zugriff. Prüf, ob das Token für dieses Repo die Berechtigung „Contents: Read and write“ hat.",
    404:what==="repo"?"Repo nicht gefunden. Prüf Besitzer und Repo-Name, und ob das Token Zugriff auf dieses Repo hat.":"Datei oder Branch nicht gefunden. Prüf den Branch-Namen in den Einstellungen."}[status];
  return {status,msg:m||`GitHub hat mit Fehler ${status} geantwortet. Versuch es gleich noch einmal.`};
}

function snapshotData(){ return {version:1,updatedAt:Date.now(),listsUpdatedAt:S.listsUpdatedAt||0,lists:S.lists,videos:[...S.videos.values()].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)),series:[...S.series.values()].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)),channels:[...S.channels.values()].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)),feedHidden:pruneHidden(S.feedHidden)}; }
function pruneHidden(h){ const lim=Date.now()-120*864e5; const o={}; for(const [k,t] of Object.entries(h||{})) if(t>lim) o[k]=t; return o; }
function applyData(d){
  S.videos=new Map((d?.videos||[]).filter(v=>v&&v.id).map(v=>[v.id,v]));
  S.series=new Map((d?.series||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
  S.channels=new Map((d?.channels||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
  S.feedHidden={...(d?.feedHidden||{})};
  if(d?.lists) S.lists={genres:d.lists.genres||[],formats:d.lists.formats||[],moods:d.lists.moods||[],moodLabel:d.lists.moodLabel||"",desc:d.lists.desc||{}};
  S.listsUpdatedAt=d?.listsUpdatedAt||0;
}
function mergeRemote(d){
  const out=new Map();
  for(const v of d?.videos||[]) if(v&&v.id&&!S.deleted.has(v.id)) out.set(v.id,v);
  for(const v of S.videos.values()){ const r=out.get(v.id); if(!r||(v.updatedAt||0)>=(r.updatedAt||0)) out.set(v.id,v); }
  S.videos=out;
  const so=new Map();
  for(const x of d?.series||[]) if(x&&x.id&&!S.deletedSeries.has(x.id)) so.set(x.id,x);
  for(const x of S.series.values()){ const r=so.get(x.id); if(!r||(x.updatedAt||0)>=(r.updatedAt||0)) so.set(x.id,x); }
  S.series=so;
  const co=new Map();
  for(const x of d?.channels||[]) if(x&&x.id&&!S.deletedChannels.has(x.id)) co.set(x.id,x);
  for(const x of S.channels.values()){ const r=co.get(x.id); if(!r||(x.updatedAt||0)>=(r.updatedAt||0)) co.set(x.id,x); }
  S.channels=co;
  for(const [k,t] of Object.entries(d?.feedHidden||{})) if(!(k in S.feedHidden)&&!S.unhidden.has(k)) S.feedHidden[k]=t;
  if(d?.lists&&(d.listsUpdatedAt||0)>(S.listsUpdatedAt||0)){ S.lists=d.lists; S.listsUpdatedAt=d.listsUpdatedAt; }
}
function cacheLocal(){ lsSet(LS_CACHE,{data:snapshotData(),sha:S.sha,dirty:S.dirty,deleted:[...S.deleted],deletedSeries:[...S.deletedSeries],deletedChannels:[...S.deletedChannels],unhidden:[...S.unhidden],repoKey:repoKey()}); }
const repoKey=()=>`${S.cfg.owner}/${S.cfg.repo}@${S.cfg.branch}:${S.cfg.path}`;

let pushTimer=null, pushing=false;
function persist(){ S.dirty=true; cacheLocal(); setSync(); if(!GH.ready()) return; clearTimeout(pushTimer); pushTimer=setTimeout(push,1200); }
async function push(){
  if(!GH.ready()||!S.dirty) return;
  if(pushing){ clearTimeout(pushTimer); pushTimer=setTimeout(push,800); return; }
  pushing=true; S.syncState="busy"; setSync();
  try{
    for(let attempt=0;attempt<3;attempt++){
      try{ S.sha=await GH.write(snapshotData(),S.sha); S.dirty=false; S.deleted.clear(); S.deletedSeries.clear(); S.deletedChannels.clear(); S.unhidden.clear(); S.syncState="ok"; S.syncErr=""; break; }
      catch(e){ if(!e.conflict||attempt===2) throw e; const remote=await GH.read(); S.sha=remote.sha; mergeRemote(remote.data); render(); }
    }
  }catch(e){ S.syncState="err"; S.syncErr=e.msg||"Speichern auf GitHub fehlgeschlagen. Prüf deine Verbindung."; }
  pushing=false; cacheLocal(); setSync(); showNotice();
}
async function pull({quiet}={}){
  if(!GH.ready()) return;
  if(!quiet){ S.syncState="busy"; setSync(); }
  try{
    const remote=await GH.read();
    if(S.dirty){ mergeRemote(remote.data); S.sha=remote.sha; persist(); }
    else if(remote.sha!==S.sha||!quiet){ if(remote.data) applyData(remote.data); else { S.videos=new Map(); S.series=new Map(); S.channels=new Map(); S.feedHidden={}; } S.sha=remote.sha; }
    S.syncState=S.dirty?"busy":"ok"; S.syncErr="";
    if(!remote.sha&&!S.dirty){ S.syncState="ok"; }
    cacheLocal();
  }catch(e){ S.syncState="err"; S.syncErr=e.msg||"GitHub ist gerade nicht erreichbar. Deine Änderungen bleiben in diesem Browser gespeichert."; }
  S.loaded=true; setSync(); showNotice(); render();
}
function setSync(){
  const b=$("#sync"); if(!b) return;
  let cls="",txt;
  if(!GH.ready()){ txt="Nur lokal"; }
  else if(S.syncState==="busy"||(S.dirty&&S.syncState!=="err")){ cls="busy"; txt="Speichert …"; }
  else if(S.syncState==="err"){ cls="err"; txt="Nicht synchron"; }
  else { cls="ok"; txt="Synchron"; }
  b.className="sync "+cls; b.querySelector("span").textContent=txt;
  b.title=S.syncErr||"Speicherstatus und Einstellungen";
}
function showNotice(){
  const n=$("#notice");
  if(!GH.ready()) n.innerHTML=`<div class="notice"><span>Die Bibliothek ist noch nicht mit GitHub verbunden und wird nur in diesem Browser gespeichert.</span><button class="btn" data-settings>GitHub verbinden</button></div>`;
  else if(S.syncState==="err") n.innerHTML=`<div class="notice"><span>${esc(S.syncErr)}</span><span class="actions"><button class="btn" data-retry>Erneut versuchen</button><button class="btn ghost" data-settings>Einstellungen</button></span></div>`;
  else n.innerHTML="";
}

  cfg:Object.assign({owner:"",repo:"",branch:"main",path:"library.json",token:"",ytKey:""},lsGet(LS_CFG,{})),
  sha:null, dirty:false, deleted:new Set(), syncState:"", syncErr:"",

  sf:{kind:new Set(),progress:"all"}, openSeries:null, q:"", sort:lsGet("vt-sort","added"), creatorQ:"", openId:null, playing:false

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

function parseId(input){
  if(!input) return null;
  const s=input.trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  let u; try{u=new URL(/^https?:/i.test(s)?s:"https://"+s)}catch(e){return null}
  const h=u.hostname.replace(/^(www|m|music)\./,"");
  if(h==="youtu.be") return (u.pathname.slice(1).match(/^[\w-]{11}/)||[])[0]||null;
  if(h==="youtube.com"||h==="youtube-nocookie.com"){
    const v=u.searchParams.get("v"); if(v&&/^[\w-]{11}$/.test(v)) return v;
    const m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/); if(m) return m[1];
  }
  return null;
}
const ytUrl = id=>"https://www.youtube.com/watch?v="+id;
const thumb = id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
function fmtDur(sec){ if(!sec&&sec!==0) return ""; sec=Math.round(sec); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; }
function parseDur(t){ t=(t||"").trim(); if(!t) return null; if(/^\d+$/.test(t)) return +t*60;
  const p=t.split(":").map(Number); if(p.some(isNaN)||p.length>3) return undefined; return p.reduce((a,b)=>a*60+b,0); }
function isoDur(s){ const m=/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(s||""); if(!m) return null; return (+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0); }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return dd?`${dd}.${m}.${y}`:d; }
const titleOf = v=>v.title||"Unbenanntes Video";
function coverVars(v){ const gi=S.lists.genres.indexOf(v.genre); const h=gi>=0?(gi*47+200)%360:hash(v.creator||v.id)%360; return `--h:${h}`; }

function coverHTML(v,{badges=true}={}){
  const rx=(v.reactsTo||[]).length, back=reactionsTo(v.id).length;
  return `<div class="cover" style="${coverVars(v)}">
    <div class="ini">${esc(v.creator||"–")}</div>
    <div class="ttl">${esc(titleOf(v))}</div>
    <img src="${thumb(v.id)}" alt="" loading="lazy" onerror="this.remove()">
    ${badges?`<div class="tl">${v.watched?'<span class="badge">✓ gesehen</span>':''}${back?`<span class="badge">${back} Reaction${back>1?"s":""}</span>`:''}</div>
    <div class="badges">${rx?'<span class="badge rx">Reaction</span>':''}${v.status&&v.status!=="Verfügbar"?`<span class="badge">${esc(v.status)}</span>`:''}${v.duration?`<span class="badge">${fmtDur(v.duration)}</span>`:''}</div>`:''}
  </div>`;
}
function reactionsTo(id){ const out=[]; for(const v of S.videos.values()) if((v.reactsTo||[]).includes(id)) out.push(v); return out; }
function allTags(){ const m=new Map(); for(const v of S.videos.values()) for(const t of v.tags||[]) m.set(t,(m.get(t)||0)+1); return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function allCreators(){ const m=new Map(); for(const v of S.videos.values()) if(v.creator) m.set(v.creator,(m.get(v.creator)||0)+1); return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }

function originsOf(v){ return (v.reactsTo||[]).map(id=>S.videos.get(id)).filter(Boolean); }
function effGenres(v){ const g=new Set(v.genre?[v.genre]:[]); if(S.f.inclRx) for(const o of originsOf(v)) if(o.genre) g.add(o.genre); return [...g]; }
function effTags(v){ const t=new Set(v.tags||[]); if(S.f.inclRx) for(const o of originsOf(v)) for(const x of o.tags||[]) t.add(x); return [...t]; }
function matches(v,skip){
  const f=S.f;
  if(skip!=="genre"&&f.genre.size&&!effGenres(v).some(g=>f.genre.has(g))) return false;
  if(skip!=="format"&&f.format.size&&!f.format.has(v.format)) return false;
  if(skip!=="mood"&&f.mood.size&&!f.mood.has(v.mood)) return false;
  if(skip!=="creator"&&f.creator.size&&!f.creator.has(v.creator)) return false;
  if(skip!=="status"&&f.status.size&&!f.status.has(v.status||"Verfügbar")) return false;
  if(skip!=="series"&&f.series.size&&!(SI.get(v.id)||[]).some(p=>f.series.has(p.s.id))) return false;
  if(skip!=="tags"&&f.tags.size){ const et=effTags(v); for(const t of f.tags) if(!et.includes(t)) return false; }
  if(skip!=="rx"&&f.rx!=="all"){ if(!isReaction(v)) return false; const has=(v.reactsTo||[]).length>0;
    if(f.rx==="missing"&&(has||v.extOrig)) return false; if(f.rx==="linked"&&!has) return false; if(f.rx==="external"&&!v.extOrig) return false; }
  if(skip!=="todo"&&f.todo){ if(f.todo==="old"&&!LIST_KEYS.some(([lk,k])=>isOldVal(lk,v[k]))) return false; if(f.todo==="nogenre"&&v.genre) return false; if(f.todo==="noformat"&&v.format) return false; if(f.todo==="nomood"&&v.mood) return false; }
  if(skip!=="watched"){ if(f.watched==="yes"&&!v.watched) return false; if(f.watched==="no"&&v.watched) return false; }
  if(S.q){ const hay=[v.title,v.creator,v.genre,v.format,v.mood,v.notes,...(v.tags||[])].join(" ").toLowerCase();
    for(const w of S.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!hay.includes(w)) return false; }
  return true;
}
function sorted(list){
  if(S.f.series.size===1){ const sid=[...S.f.series][0]; const pos=id=>(SI.get(id)||[]).find(p=>p.s.id===sid)?.i??1e9; return list.sort((a,b)=>pos(a.id)-pos(b.id)); }
  const by={added:(a,b)=>(b.addedAt||0)-(a.addedAt||0), upload:(a,b)=>(b.uploadDate||"").localeCompare(a.uploadDate||""),
    title:(a,b)=>titleOf(a).localeCompare(titleOf(b),"de"), creator:(a,b)=>(a.creator||"~").localeCompare(b.creator||"~","de")||titleOf(a).localeCompare(titleOf(b),"de"),
    dur:(a,b)=>(b.duration||0)-(a.duration||0)}[S.sort]||((a,b)=>0);
  return list.sort(by);
}

/* ================= Metadaten von YouTube ================= */
async function fetchMeta(ids){ // → Map id → {title,creator,uploadDate,duration,status} | null (nicht gefunden)
  const out=new Map();
  if(S.cfg.ytKey){
    for(let i=0;i<ids.length;i+=50){
      const chunk=ids.slice(i,i+50);
      const r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,status&id=${chunk.join(",")}&key=${encodeURIComponent(S.cfg.ytKey)}`);
      if(!r.ok){ const j=await r.json().catch(()=>({})); throw {msg:r.status===400||r.status===403?`Der YouTube-API-Schlüssel wurde abgelehnt${j?.error?.message?": "+j.error.message:""}.`:`YouTube-API-Fehler ${r.status}.`}; }
      const j=await r.json();
      for(const id of chunk) out.set(id,null);
      for(const it of j.items||[]) out.set(it.id,{title:it.snippet?.title||"",creator:it.snippet?.channelTitle||"",channelId:it.snippet?.channelId||"",desc:it.snippet?.description||"",
        uploadDate:(it.snippet?.publishedAt||"").slice(0,10),duration:isoDur(it.contentDetails?.duration),
        status:it.status?.privacyStatus==="private"?"Privat":"Verfügbar"});
    }
  } else {
    for(const id of ids){
      const r=await fetch(`https://noembed.com/embed?url=${encodeURIComponent(ytUrl(id))}`);
      if(!r.ok) throw {msg:"Der Metadaten-Dienst ist gerade nicht erreichbar."};
      const j=await r.json();
      out.set(id,j.error?null:{title:j.title||"",creator:j.author_name||"",status:"Verfügbar"});
    }
  }
  return out;
}

    ${facetBlock("Genre","genre",withExtra(S.lists.genres,gC),gC,"genres")}

function renderGrid(){

function parsePlaylistId(input){
  if(/^(PL|UU|OL|FL|LL|WL|RD)[\w-]{0,}$/.test((input||"").trim())&&(input.trim().length>=10||/^(WL|LL)$/.test(input.trim()))) return input.trim();
  try{ const u=new URL(/^https?:/i.test(input.trim())?input.trim():"https://"+input.trim()); const l=u.searchParams.get("list"); return l&&/^[\w-]{10,}$/.test(l)?l:null; }
  catch(e){ return /^(PL|UU|OL|FL)[\w-]{10,}$/.test(input.trim())?input.trim():null; }
}
const plUrl=pid=>"https://www.youtube.com/playlist?list="+pid;
function seriesStats(x){
  const vs=x.videoIds.map(id=>S.videos.get(id)).filter(Boolean);
  const ok=vs.filter(v=>v.watched||(v.status||"Verfügbar")!=="Nicht mehr verfügbar");
  const done=ok.filter(v=>v.watched).length, dur=ok.reduce((a,v)=>a+(v.duration||0),0);
  const creators=[...new Set(vs.map(v=>v.creator).filter(Boolean))];
  const next=ok.find(v=>!v.watched);
  return {vs,n:ok.length,total:vs.length,gone:vs.length-ok.length,done,dur,creators,next,pct:ok.length?Math.round(done/ok.length*100):0};
}
function fmtLong(sec){ if(!sec) return ""; const h=Math.floor(sec/3600),m=Math.round(sec%3600/60); return h?`${h} h ${m} min`:`${m} min`; }
function updateSeries(id,patch){ const x=S.series.get(id); if(!x) return; S.series.set(id,{...x,...patch,updatedAt:Date.now()}); persist(); render(); }
function moveInSeries(sid,vid,dir){ const x=S.series.get(sid); const a=[...x.videoIds]; const i=a.indexOf(vid), j=i+dir; if(i<0||j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; updateSeries(sid,{videoIds:a}); }
function newVideo(id,m,def,offset=0){

    status:(m===null||m?.gone)?"Nicht mehr verfügbar":(m?.status||"Verfügbar"),watched:false,notes:"",reactsTo:[],addedAt:now,updatedAt:now};
}
function applyDefaults(v,def){ // nur leere Felder füllen, Tags ergänzen

function seriesMatches(x,skip){

  if(S.q){ const hay=[x.name,x.description,x.kind,...st.creators,...st.vs.map(v=>v.title)].join(" ").toLowerCase();
    for(const w of S.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!hay.includes(w)) return false; }
  return true;
}

/* ---------- Playlist ---------- */
async function ytJson(url){
  const r=await fetch(url); const j=await r.json().catch(()=>({}));
  if(!r.ok) throw {msg:r.status===400||r.status===403?`YouTube hat die Anfrage abgelehnt${j?.error?.message?": "+j.error.message:""}.`:`YouTube-API-Fehler ${r.status}.`};
  return j;
}
async function fetchPlaylist(pid,onProgress){
  if(!S.cfg.ytKey) throw {msg:"Für Playlists brauchst du den YouTube-API-Schlüssel (Einstellungen). Ohne Schlüssel kannst du die Video-URLs unten einzeln einfügen.",nokey:true};
  if(/^(WL|LL)$/.test(pid)) throw {msg:"„Später ansehen“ und „Videos mit „Mag ich““ sind privat und lassen sich nicht laden."};
  if(/^RD/.test(pid)) throw {msg:"Das ist ein automatischer YouTube-Mix. Mixe lassen sich nicht als Playlist laden."};
  const key=encodeURIComponent(S.cfg.ytKey);
  const pj=await ytJson(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${pid}&key=${key}`);
  const info=pj.items?.[0];
  if(!info) throw {msg:"Playlist nicht gefunden. Private Playlists lassen sich nicht laden, öffentliche und nicht gelistete schon."};
  const ids=[], titles=new Map(); let page="";
  do{ const j=await ytJson(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${pid}&key=${key}${page?"&pageToken="+page:""}`);
    for(const it of j.items||[]){ const id=it.contentDetails?.videoId; if(id&&!ids.includes(id)){ ids.push(id); const t=it.snippet?.title||""; titles.set(id,t==="Deleted video"?"Gelöschtes Video":t==="Private video"?"Privates Video":t); } }
    page=j.nextPageToken; onProgress?.(ids.length);
  }while(page&&ids.length<2000);
  const meta=await fetchMeta(ids);
  for(const [id,m] of meta) if(m===null) meta.set(id,{gone:true,title:titles.get(id)||""});
  return {title:info.snippet?.title||"",channel:info.snippet?.channelTitle||"",description:info.snippet?.description||"",ids,meta};
}
async function syncPlaylist(sid){
  const x=S.series.get(sid); if(!x?.playlistId) return;
  toast("Gleiche mit Playlist ab …");
  try{ const pl=await fetchPlaylist(x.playlistId);
    const fresh=pl.ids.filter(id=>!x.videoIds.includes(id)); const missing=x.videoIds.filter(id=>!pl.ids.includes(id)).length;
    fresh.forEach((id,i)=>{ if(!S.videos.has(id)) S.videos.set(id,newVideo(id,pl.meta.get(id),x.defaults||{},fresh.length-i)); });
    for(const [id,m] of pl.meta){ const v=S.videos.get(id); if(v&&m?.gone&&v.status!=="Nicht mehr verfügbar") S.videos.set(id,{...v,status:"Nicht mehr verfügbar",updatedAt:Date.now()}); }
    updateSeries(sid,{videoIds:[...x.videoIds,...fresh]});
    toast(fresh.length?`${fresh.length} neue ${fresh.length===1?"Folge":"Folgen"} hinzugefügt`:"Schon auf dem neuesten Stand");
    if(missing) setTimeout(()=>toast(`${missing} ${missing===1?"Teil ist":"Teile sind"} nicht mehr in der Playlist (bleiben in der Reihe)`),2000);
  }catch(e){ toast(e.msg||"Abgleich fehlgeschlagen"); }
}

const LS_FEED="vt-feed", LS_FEEDSEEN="vt-feedseen";
const F={ items:[], fetchedAt:0, loading:false, progress:"", errors:[], seenPrev:lsGet(LS_FEEDSEEN,0),
  show:"all", ch:new Set(), showHidden:false, chQ:"" };
(()=>{ const c=lsGet(LS_FEED,null); if(c){ F.items=c.items||[]; F.fetchedAt=c.fetchedAt||0; } })();
function saveFeedCache(){ lsSet(LS_FEED,{fetchedAt:F.fetchedAt,items:F.items}); }
const splitWords=t=>(t||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
function chRuleSummary(c){ const p=[]; const inc=splitWords(c.include), exc=splitWords(c.exclude);
  if(inc.length) p.push("nur: "+inc.join(", ")); if(exc.length) p.push("ohne: "+exc.join(", ")); if(c.hideShorts) p.push("keine Shorts"); return p.join(" · "); }
function passesRules(it){
  const c=S.channels.get(it.channelId); if(!c) return false;
  const t=(it.title||"").toLowerCase();
  const inc=splitWords(c.include); if(inc.length&&!inc.some(w=>t.includes(w))) return false;
  if(splitWords(c.exclude).some(w=>t.includes(w))) return false;
  if(c.hideShorts&&it.duration&&it.duration<=180) return false;
  return true;
}
function feedVisible({skipCh}={}){
  return F.items.filter(it=>{
    if(!passesRules(it)) return false;
    if(!F.showHidden&&S.feedHidden[it.id]) return false;
    if(!skipCh&&F.ch.size&&!F.ch.has(it.channelId)) return false;
    if(F.show==="new"&&!(Date.parse(it.published)>F.seenPrev)) return false;
    if(F.show==="fav"&&!S.channels.get(it.channelId)?.fav) return false;
    if(F.show==="notin"&&S.videos.has(it.id)) return false;
    if(S.q){ const hay=(it.title+" "+it.channelTitle).toLowerCase(); for(const w of S.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!hay.includes(w)) return false; }
    return true;
  }).sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));
}
function newFeedCount(){ return F.items.filter(it=>passesRules(it)&&!S.feedHidden[it.id]&&!S.videos.has(it.id)&&Date.parse(it.published)>lsGet(LS_FEEDSEEN,0)).length; }
function dayLabel(iso){
  const d=new Date(iso), now=new Date(); const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((day(now)-day(d))/864e5);
  if(diff===0) return "Heute"; if(diff===1) return "Gestern";
  if(diff<7) return d.toLocaleDateString("de-DE",{weekday:"long"});
  return d.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:d.getFullYear()!==now.getFullYear()?"numeric":undefined});
}
function relTime(iso){ const m=Math.round((Date.now()-Date.parse(iso))/6e4); if(m<60) return `vor ${Math.max(m,1)} min`; const h=Math.round(m/60); if(h<24) return `vor ${h} h`; const d=Math.round(h/24); return d===1?"vor 1 Tag":`vor ${d} Tagen`; }

async function refreshFeed(){
  if(F.loading) return;
  if(!S.cfg.ytKey){ F.errors=[{msg:"Für die Abos brauchst du den YouTube-API-Schlüssel. Trag ihn in den Einstellungen ein."}]; render(); return; }
  if(!S.channels.size) return;
  F.loading=true; F.errors=[]; F.progress="Lade Kanäle …"; renderFeedStatus();
  const key=encodeURIComponent(S.cfg.ytKey); const chans=[...S.channels.values()]; let done=0;
  const found=new Map();
  const one=async c=>{
    const upl="UU"+c.id.slice(2); const deep=splitWords(c.include).length>0;
    let page="", pages=0;
    try{
      do{ const j=await ytJson(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=${deep?50:15}&playlistId=${upl}&key=${key}${page?"&pageToken="+page:""}`);
        for(const it of j.items||[]){ const id=it.contentDetails?.videoId; if(!id) continue;
          const t=it.snippet?.title||""; if(t==="Private video"||t==="Deleted video") continue;
          found.set(id,{id,channelId:c.id,channelTitle:c.title,title:t,desc:(it.snippet?.description||"").slice(0,400),published:it.contentDetails?.videoPublishedAt||it.snippet?.publishedAt}); }
        page=j.nextPageToken; pages++;
      }while(deep&&page&&pages<3);
    }catch(e){ F.errors.push({channel:c.title,msg:e.msg||"Fehler"}); }
    done++; F.progress=`${done} von ${chans.length} Kanälen geladen …`; renderFeedStatus();
  };
  const queue=[...chans]; await Promise.all(Array.from({length:6},async()=>{ while(queue.length) await one(queue.shift()); }));
  // Dauer und Live-Status nachladen
  const ids=[...found.keys()];
  try{ for(let i=0;i<ids.length;i+=50){ const j=await ytJson(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${ids.slice(i,i+50).join(",")}&key=${key}`);
      for(const v of j.items||[]){ const it=found.get(v.id); if(!it) continue; it.duration=isoDur(v.contentDetails?.duration); it.live=v.snippet?.liveBroadcastContent||"none"; } }
  }catch(e){ F.errors.push({msg:"Dauer konnte nicht geladen werden: "+(e.msg||"")}); }
  const keep=Date.now()-60*864e5;
  F.items=[...found.values()].filter(it=>it.live!=="upcoming"&&Date.parse(it.published)>keep).sort((a,b)=>Date.parse(b.published)-Date.parse(a.published)).slice(0,4000);
  F.fetchedAt=Date.now(); F.loading=false; F.progress="";
  saveFeedCache(); render();
}

  return `${F.fetchedAt?`<span class="hint">Aktualisiert ${relTime(new Date(F.fetchedAt).toISOString())}</span>`:""}<button class="btn" data-feedrefresh ${S.cfg.ytKey&&S.channels.size?"":"disabled"}>Aktualisieren</button>${errs}`;
}

async function resolveChannel(input){
  if(!S.cfg.ytKey) throw {msg:"Zum Hinzufügen von Kanälen brauchst du den YouTube-API-Schlüssel (Einstellungen)."};
  const key=encodeURIComponent(S.cfg.ytKey); const s=input.trim();
  let q=null;
  const idm=s.match(/(UC[\w-]{22})/); if(idm) q="id="+idm[1];
  if(!q){ const hm=s.match(/@([\w.\-·]+)/); if(hm) q="forHandle="+encodeURIComponent("@"+hm[1]); }
  if(!q){ const vid=parseId(s); if(vid){ const m=(await fetchMeta([vid])).get(vid); if(m?.channelId) q="id="+m.channelId; } }
  if(!q&&/^[\w.\-]{3,}$/.test(s)) q="forHandle="+encodeURIComponent("@"+s);
  if(!q) throw {msg:"Das erkenne ich nicht. Füge die Kanal-URL ein (z. B. youtube.com/@NHL), das @Handle oder die URL eines Videos des Kanals."};
  const j=await ytJson(`https://www.googleapis.com/youtube/v3/channels?part=snippet&${q}&key=${key}`);
  const c=j.items?.[0]; if(!c) throw {msg:"Diesen Kanal gibt es nicht. Prüf die Schreibweise des @Handles."};
  return {id:c.id,title:c.snippet?.title||c.id,handle:c.snippet?.customUrl||""};
}
function starBtn(c){ return `<button type="button" class="star ${c.fav?"on":""}" data-fav="${c.id}" aria-pressed="${!!c.fav}" aria-label="${c.fav?"Favorit entfernen":"Als Favorit markieren"}" title="${c.fav?"Favorit entfernen":"Als Favorit markieren"}">${c.fav?"★":"☆"}</button>`; }
function toggleFav(id){ const c=S.channels.get(id); if(!c) return; S.channels.set(id,{...c,fav:!c.fav,updatedAt:Date.now()}); persist();
  if($("#cm-list")) renderChannelList(); render(); toast(c.fav?`„${c.title}“ ist kein Favorit mehr`:`„${c.title}“ ist jetzt Favorit`); }
function addChannel(c){
  const now=Date.now(); const ex=S.channels.get(c.id);
  S.channels.set(c.id,ex?{...ex,title:c.title||ex.title,updatedAt:now}:{id:c.id,title:c.title,handle:c.handle||"",include:"",exclude:"",hideShorts:false,genre:"",format:"",tags:[],addedAt:now,updatedAt:now});
  S.deletedChannels.delete(c.id); return !ex;
}
function parseTakeoutCsv(text){
  const out=[]; const seen=new Set();
  for(const line of text.split(/\r?\n/)){
    const m=line.match(/(UC[\w-]{22})/); if(!m||seen.has(m[1])) continue; seen.add(m[1]);
    const cells=[]; let cur="", q=false;
    for(const ch of line){ if(ch==='"') q=!q; else if(ch===","&&!q){ cells.push(cur); cur=""; } else cur+=ch; }
    cells.push(cur);
    out.push({id:m[1],title:(cells[cells.length-1]||m[1]).trim()});
  }
  return out;
}

function parseBulk(text){
  const items=[];
  for(const tok of (text||"").split(/[\s,;]+/).map(t=>t.trim()).filter(Boolean)){
    const vid=parseId(tok), pid=parsePlaylistId(tok);
    if(vid&&(/youtu/i.test(tok)||/^[\w-]{11}$/.test(tok))) items.push({v:vid});
    else if(pid) items.push({p:pid});
    else items.push({bad:tok});
  }
  return items;
}

function applyValueMap(maps){
  let n=0; const now=Date.now();
  for(const v of [...S.videos.values()]){ const p={};
    for(const f of ["genre","format","mood"]){ const to=maps[f]?.[v[f]]; if(v[f]&&to!==undefined&&to!==v[f]) p[f]=to; }
    if(Object.keys(p).length){ S.videos.set(v.id,{...v,...p,updatedAt:now}); n++; } }
  for(const c of [...S.channels.values()]){ const p={};
    for(const f of ["genre","format"]){ const to=maps[f]?.[c[f]]; if(c[f]&&to!==undefined&&to!==c[f]) p[f]=to; }
    if(Object.keys(p).length) S.channels.set(c.id,{...c,...p,updatedAt:now}); }
  for(const x of [...S.series.values()]){ const d={...(x.defaults||{})}; let ch=false;
    for(const f of ["genre","format","mood"]){ const to=maps[f]?.[d[f]]; if(d[f]&&to!==undefined&&to!==d[f]){ d[f]=to; ch=true; } }
    if(ch) S.series.set(x.id,{...x,defaults:d,updatedAt:now}); }
  for(const f of ["genre","format","mood"]) S.f[f].clear();
  return n;
}
function oldValues(){ // Werte an Videos, die in keiner Liste mehr stehen
  const out={genre:new Map(),format:new Map(),mood:new Map()};
  for(const v of S.videos.values()) for(const [lk,f] of LIST_KEYS) if(v[f]&&!S.lists[lk].includes(v[f])) out[f].set(v[f],(out[f].get(v[f])||0)+1);
  return out;
}
const isOldVal=(lk,val)=>!!val&&!S.lists[lk].includes(val);

/* ---------- Listen & Einordnung ---------- */
let LE=null;
function openLists(tab){ if(!["genres","formats","moods"].includes(tab)) tab="genres";
  LE={tab,label:S.lists.moodLabel||"Stimmung",rows:{},recOpen:false};
  for(const [lk] of LIST_KEYS) LE.rows[lk]=S.lists[lk].map(n=>({orig:n,name:n,desc:descOf(lk,n)}));
  S.openId=null; S.openSeries=null; S.openFeed=null;
  $("#layer").innerHTML=`<div class="scrim"></div><div class="modal" data-modalbg><form class="sheet" id="lf" style="width:min(820px,100%)" novalidate>

    </div>
    <div class="sheet-foot"><span class="hint err" id="le-err"></span><div class="actions"><button type="button" class="btn ghost" data-close>Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div></div>

function leTabs(){ $("#le-tabs").innerHTML=[["genres","Genre"],["formats","Format"],["moods",LE.label||"Stimmung"]].map(([k,l])=>`<button type="button" data-letab="${k}" class="${LE.tab===k?"on":""}">${esc(l)} <span class="mono" style="opacity:.6">${LE.rows[k].length}</span></button>`).join(""); }
function lePane(){
  const f={genres:"genre",formats:"format",moods:"mood"}[LE.tab];
  const cnt=new Map(); for(const v of S.videos.values()) if(v[f]) cnt.set(v[f],(cnt.get(v[f])||0)+1);
  const rows=LE.rows[LE.tab];
  $("#le-pane").innerHTML=`${LE.tab==="moods"?`<div class="f" style="margin-bottom:12px"><label for="le-label">Name dieser Kategorie</label><input type="text" id="le-label" value="${esc(LE.label)}" placeholder="z. B. Stimmung oder Anspruch"></div>`:""}
    <div class="lerows">${rows.map((r,i)=>`<div class="lerow"><div class="lerow-top">
        <input type="text" class="le-name" data-i="${i}" value="${esc(r.name)}" aria-label="Name">
        <span class="hint mono" style="white-space:nowrap">${r.orig?plur(cnt.get(r.orig)||0,"Video","Videos"):"neu"}</span>
        <span class="pact"><button type="button" data-lemv="-1" data-i="${i}" ${i===0?"disabled":""} aria-label="Nach oben">↑</button><button type="button" data-lemv="1" data-i="${i}" ${i===rows.length-1?"disabled":""} aria-label="Nach unten">↓</button><button type="button" data-lerm="${i}" aria-label="Entfernen" title="Entfernen">✕</button></span></div>
        <textarea class="le-desc" data-i="${i}" rows="2" placeholder="Einordnungshilfe (optional). Erste Zeile: kurze Beschreibung. Weitere Zeilen z. B. „Dazu: …“, „Nicht: … → anderer Eintrag“.">${esc(r.desc)}</textarea></div>`).join("")||'<p class="hint">Noch keine Einträge.</p>'}</div>
    <button type="button" class="btn" data-leadd style="margin-top:8px">+ Eintrag</button>`;
}
function leSave(){
  const lists={moodLabel:(LE.label||"").trim()||"Stimmung",desc:{genres:{},formats:{},moods:{}}}; const maps={genre:{},format:{},mood:{}};
  for(const [lk,f] of LIST_KEYS){
    const names=[];
    for(const r of LE.rows[lk]){ const n=r.name.trim().replace(/\s+/g," "); if(!n) continue;
      if(r.orig&&n!==r.orig) maps[f][r.orig]=n;
      if(!names.includes(n)) names.push(n);
      if(r.desc.trim()&&!lists.desc[lk][n]) lists.desc[lk][n]=r.desc.trim(); }
    lists[lk]=names;
  }
  const n=applyValueMap(maps);
  S.lists=lists; S.listsUpdatedAt=Date.now(); persist(); closeLayer(); render();
  toast(n?`Listen gespeichert, ${plur(n,"Video","Videos")} angepasst`:"Listen gespeichert");
}
function lePreview(){
  const box=$("#le-rec"); const m=RECOMMENDED_MAP; let auto=0; const keep={genre:new Map(),format:new Map(),mood:new Map()};
  for(const v of S.videos.values()){ let a=false;
    for(const [lk,f] of LIST_KEYS){ const val=v[f]; if(!val) continue; const to=m[f][val];
      if(to!==undefined){ if(to!==val) a=true; } else if(!RECOMMENDED[lk].includes(val)) keep[f].set(val,(keep[f].get(val)||0)+1); }
    if(a) auto++; }
  const keepTxt=[["genre","Genre"],["format","Format"],["mood",moodLabel()]].map(([f,l])=>keep[f].size?`<li><b>${l}:</b> ${[...keep[f]].map(([k,c])=>`${esc(k)} (${c})`).join(", ")}</li>`:"").join("");
  box.innerHTML=`<div class="recprev">
    <div class="recgrid">${[["genres","Genre"],["formats","Format"],["moods",RECOMMENDED.moodLabel]].map(([lk,l])=>`<div><div class="lbl">${l}</div><ul>${RECOMMENDED[lk].map(x=>`<li title="${esc(firstLine(RECOMMENDED.desc[lk][x]))}">${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
    <p style="margin:0">${S.videos.size?`${plur(auto,"Video wird","Videos werden")} automatisch umbenannt.`:"Deine Bibliothek ist noch leer."}</p>
    ${keepTxt?`<div><p style="margin:0 0 4px">Diese Werte lassen sich nicht eindeutig zuordnen und bleiben vorerst stehen. Du findest sie danach in der Seitenleiste unter „Einordnen → Alte Werte“ und kannst sie mit „Videos bearbeiten“ gesammelt neu setzen:</p><ul class="keep">${keepTxt}</ul></div>`:""}
    <p class="hint" style="margin:0">Deine bisherigen Listen und Beschreibungen werden ersetzt. Eigene Einträge kannst du danach wieder hinzufügen.</p>
    <div class="actions"><button type="button" class="btn primary" data-lerecgo>Empfohlene Einteilung übernehmen</button><button type="button" class="btn ghost" data-lerecno>Abbrechen</button></div></div>`;
}
function applyRecommended(){
  const maps={}; for(const f of ["genre","format","mood"]) maps[f]=Object.fromEntries(Object.entries(RECOMMENDED_MAP[f]).filter(([a,b])=>a!==b));
  const n=applyValueMap(maps);
  S.lists=structuredClone({genres:RECOMMENDED.genres,formats:RECOMMENDED.formats,moods:RECOMMENDED.moods,moodLabel:RECOMMENDED.moodLabel,desc:RECOMMENDED.desc});
  S.listsUpdatedAt=Date.now(); persist(); closeLayer();
  const old=oldValues(); const nOld=[...S.videos.values()].filter(v=>LIST_KEYS.some(([lk,f])=>isOldVal(lk,v[f]))).length;
  if(nOld){ S.view="videos"; lsSet("vt-view","videos"); clearVideoFilters(); S.f.todo="old"; }
  render(); toast(`Einteilung übernommen${n?`, ${plur(n,"Video","Videos")} umbenannt`:""}${nOld?`. ${nOld} mit alten Werten werden angezeigt`:""}`);
}
function clearVideoFilters(){ for(const k of ["genre","format","creator","tags","mood","status","series"]) S.f[k].clear(); S.f.watched="all"; S.f.rx="all"; S.f.todo=""; }

function beApply(){
  const tl=s=>[...new Set($(s).value.split(",").map(t=>t.trim().toLowerCase().replace(/\s+/g," ")).filter(Boolean))];
  const set={}; for(const f of ["genre","format","mood","status"]){ const val=$("#be-"+f).value; if(val!=="__keep") set[f]=val; }
  const w=$("#be-watched").value; if(w!=="__keep") set.watched=w==="1";
  const tadd=tl("#be-tadd"), trm=tl("#be-trm");
  if(!Object.keys(set).length&&!tadd.length&&!trm.length){ $("#be-err").textContent="Du hast noch nichts zum Ändern ausgewählt."; return; }
  const now=Date.now(); let n=0;
  for(const id of BE.ids){ const v=S.videos.get(id); if(!v) continue;
    let tags=(v.tags||[]).filter(t=>!trm.includes(t)); for(const t of tadd) if(!tags.includes(t)) tags.push(t);
    S.videos.set(id,{...v,...set,tags,updatedAt:now}); n++; }
  persist(); closeLayer(); render(); toast(`${plur(n,"Video","Videos")} geändert`);
}

        <div class="hint" id="e-urlhint">${v?"Die URL bleibt fest. Zum Ändern das Video löschen und neu anlegen.":S.cfg.ytKey?"Titel, Creator, Upload und Dauer werden beim Einfügen automatisch geholt.":"Titel und Creator werden beim Einfügen automatisch geholt."}</div>

function checkUrl(){
  const id=parseId($("#e-url").value), h=$("#e-urlhint");
  if(!$("#e-url").value.trim()){ h.className="hint"; h.textContent="Füge eine YouTube-URL ein."; return; }
  if(!id){ h.className="hint err"; h.textContent="Das sieht nicht nach einer YouTube-Video-URL aus."; return; }
  const ex=S.videos.get(id);
  if(ex&&ex.title){ h.className="hint err"; h.innerHTML=`Schon in der Bibliothek: „${esc(ex.title)}“. <button type="button" class="btn ghost" style="padding:0 4px;color:var(--accent)" data-open="${id}">Öffnen</button>`; return; }
  h.className="hint ok"; h.textContent=ex?"Dieses Video existiert schon als Original-Platzhalter und wird jetzt vervollständigt.":`Video-ID ${id} erkannt.`;
  const pl=parsePlaylistId($("#e-url").value);
  if(pl) h.insertAdjacentHTML("beforeend",` Die URL gehört auch zu einer Playlist. <button type="button" class="btn ghost" style="padding:0 4px;color:var(--accent)" data-importpl="${esc($("#e-url").value.trim())}">Ganze Playlist importieren</button>`);
  if(E.autoFetched!==id){ E.autoFetched=id; E.desc=undefined; E.sugg=null; autofill(false); }
  renderRxRes();
}
async function autofill(force){
  const id=E.id||parseId($("#e-url").value), btn=$("#e-fetch"), h=$("#e-urlhint");
  if(!id){ h.className="hint err"; h.textContent="Zuerst eine gültige YouTube-URL einfügen."; return; }
  btn.disabled=true; btn.textContent="Hole …";
  try{
    const m=(await fetchMeta([id])).get(id);
    if(!m){ $("#e-status").value="Nicht mehr verfügbar"; h.className="hint err"; h.textContent="YouTube kennt dieses Video nicht (mehr) oder es ist privat. Status steht jetzt auf „Nicht mehr verfügbar“."; return; }
    const setIf=(sel,val)=>{ if(val&&(force||!$(sel).value)) $(sel).value=val; };
    if(m.channelId) E.channelId=m.channelId;
    setIf("#e-title",m.title); setIf("#e-creator",m.creator); setIf("#e-upload",m.uploadDate);
    if(m.duration) setIf("#e-dur",fmtDur(m.duration));
    if(m.status) $("#e-status").value=m.status;

    if(typeof m.desc==="string"){ E.desc=m.desc; await suggestOriginals({auto:true,title:m.title}); }
  }catch(e){ h.className="hint err"; h.textContent=(e.msg||"Die Videodaten konnten nicht geholt werden.")+" Du kannst die Felder auch von Hand ausfüllen."; }
  finally{ btn.disabled=false; btn.textContent="Daten holen"; }
}
function renderTags(){
  const box=$("#e-tagbox"); if(!box) return;
  box.innerHTML=E.tags.map(t=>`<span class="chip">${esc(t)}<button type="button" data-rmtag="${esc(t)}" aria-label="Tag entfernen">✕</button></span>`).join("")+`<input id="e-tagin" placeholder="${E.tags.length?"":"Tag eingeben, Enter zum Hinzufügen"}" autocomplete="off">`;
  const inp=$("#e-tagin");
  inp.addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===",")&&inp.value.trim()){ e.preventDefault(); addTag(inp.value); }
    else if(e.key==="Enter") e.preventDefault();
    else if(e.key==="Backspace"&&!inp.value&&E.tags.length){ E.tags.pop(); renderTags(); $("#e-tagin").focus(); }
  });
  inp.addEventListener("input",renderSugg);
  renderSugg();
}
function renderSugg(){
  const q=($("#e-tagin")?.value||"").trim().toLowerCase();
  const list=allTags().map(t=>t[0]).filter(t=>!E.tags.includes(t)&&(!q||t.includes(q))).slice(0,q?12:10);
  $("#e-sugg").innerHTML=list.length?`<span class="hint" style="align-self:center">${q?"Vorhandene Tags:":"Häufig benutzt:"}</span>`+list.map(t=>`<button type="button" class="chip" data-addtag="${esc(t)}">+ ${esc(t)}</button>`).join(""):"";
}
function addTag(raw){ const t=raw.replace(/,/g," ").trim().toLowerCase().replace(/\s+/g," "); if(t&&!E.tags.includes(t)) E.tags.push(t); renderTags(); $("#e-tagin").focus(); }

/* ---------- Originale aus der Beschreibung ---------- */
function extractYtIds(text){
  const out=[]; const re=/(?:youtube\.com\/(?:watch\?(?:[^\s"<]*?&(?:amp;)?)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/gi; let m;
  while((m=re.exec(text||""))) if(!out.includes(m[1])) out.push(m[1]);
  return out;
}
function suggHTML(){
  if(!E.sugg){ return S.cfg.ytKey&&(E.id||parseId($("#e-url")?.value||""))?`<div><button type="button" class="btn" data-findorig>Originale in der Beschreibung suchen</button></div>`:""; }
  const list=E.sugg.filter(x=>!E.reactsTo.includes(x.id));
  if(!E.sugg.length) return `<span class="hint">In der Beschreibung ist kein anderes YouTube-Video verlinkt.</span>`;
  if(!list.length) return "";
  return `<div class="sugbox"><span class="hint">In der Beschreibung verlinkt:</span>${list.map(x=>`<div class="rxsel">${miniHTML(x,"data-noop")}<button type="button" class="btn" data-sugg="${x.id}">${x.inLib?"Verknüpfen":"Anlegen & verknüpfen"}</button></div>`).join("")}</div>`;
}
async function suggestOriginals({auto,title}={}){
  const self=E.id||parseId($("#e-url").value); if(!self) return;
  try{
    if(typeof E.desc!=="string"){ const m=(await fetchMeta([self])).get(self); E.desc=m?.desc||""; title=title||m?.title; }
    const ids=extractYtIds(E.desc).filter(id=>id!==self).slice(0,12);
    const unknown=ids.filter(id=>!S.videos.has(id)); const meta=unknown.length?await fetchMeta(unknown):new Map();
    E.sugg=ids.map(id=>{ const v=S.videos.get(id); if(v) return {...v,inLib:true}; const m=meta.get(id); return m?{id,title:m.title,creator:m.creator,duration:m.duration,meta:m,inLib:false}:null; }).filter(Boolean);
  }catch(e){ E.sugg=null; if(!auto){ const h=$("#e-urlhint"); h.className="hint err"; h.textContent=e.msg||"Die Beschreibung konnte nicht geladen werden."; } return; }
  if(!$("#e-format")) return;
  const fmt=$("#e-format"), looksRx=/react|reagier|reaktion/i.test(title||$("#e-title").value);
  const rxo=[...fmt.options].find(o=>isRxFormat(o.value));
  if(auto&&E.sugg.length&&!fmt.value&&looksRx&&rxo){ fmt.value=rxo.value; selHint(fmt); const h=$("#e-urlhint"); h.textContent+=` Sieht nach einer Reaction aus: Format gesetzt, ${plur(E.sugg.length,"verlinktes Video","verlinkte Videos")} unten als Original vorgeschlagen.`; }
  else if(auto&&E.sugg.length&&!isRxFormat(fmt.value)){ const h=$("#e-urlhint"); h.insertAdjacentHTML("beforeend",` In der Beschreibung ${E.sugg.length===1?"ist 1 Video":`sind ${E.sugg.length} Videos`} verlinkt. <button type="button" class="btn ghost" style="padding:0 4px;color:var(--accent)" data-asrx>Als Reaction markieren</button>`); }
  renderRx();
}
function pickSuggestion(id){
  const x=(E.sugg||[]).find(s=>s.id===id); if(!x||E.reactsTo.includes(id)) return;
  let msg="";
  if(x.inLib) msg=inheritFrom(S.videos.get(id));
  else E.stubs.set(id,newVideo(id,x.meta,{}));
  E.reactsTo.push(id); renderTags(); renderRx(); if(msg) $("#e-rxmsg").textContent=msg;
}
function inheritFrom(o){ // Genre (falls leer) und Tags des Originals übernehmen
  if(!o) return "";
  const parts=[]; const sel=$("#e-genre");
  if(o.genre&&!sel.value){
    if(![...sel.options].some(x=>x.value===o.genre)) sel.add(new Option(o.genre,o.genre));
    sel.value=o.genre; parts.push(`Genre „${o.genre}“`);
  }
  const newTags=(o.tags||[]).filter(t=>!E.tags.includes(t)); E.tags.push(...newTags);
  if(newTags.length) parts.push(newTags.length===1?"1 Tag":`${newTags.length} Tags`);
  return parts.length?`${parts.join(" und ")} vom Original übernommen. Du kannst sie oben noch anpassen.`:"";
}
function renderRxRes(){
  const box=$("#e-rxres"); if(!box) return; const q=E.rxQ.trim(); const selfId=E.id||parseId($("#e-url").value);
  if(!q){ box.innerHTML=""; return; }
  const pid=parseId(q);
  if(pid&&/youtu|^[\w-]{11}$/.test(q)){
    if(pid===selfId){ box.innerHTML=`<span class="hint err">Ein Video kann nicht auf sich selbst reagieren.</span>`; return; }
    if(E.reactsTo.includes(pid)){ box.innerHTML=`<span class="hint">Schon verknüpft.</span>`; return; }
    const ex=S.videos.get(pid);
    box.innerHTML=ex?miniHTML(ex,"data-pickrx"):`<button type="button" class="btn" data-newrx="${pid}">Als neues Original anlegen und verknüpfen</button>`;
    return;
  }
  const words=q.toLowerCase().split(/\s+/);
  const res=[...S.videos.values()].filter(v=>v.id!==selfId&&!E.reactsTo.includes(v.id)&&words.every(w=>[v.title,v.creator,...(v.tags||[])].join(" ").toLowerCase().includes(w))).slice(0,8);
  box.innerHTML=res.length?res.map(v=>miniHTML(v,"data-pickrx")).join(""):`<span class="hint">Kein passendes Video. Füge die URL des Originals ein, um es neu anzulegen.</span>`;
}

async function save(){
  const err=$("#e-err"); err.textContent="";
  const id=E.id||parseId($("#e-url").value);
  if(!id){ err.textContent="Bitte eine gültige YouTube-URL einfügen."; $("#e-url").focus(); return; }
  if(E.isNew&&S.videos.get(id)?.title){ err.textContent="Dieses Video ist schon in deiner Bibliothek."; return; }
  const pending=$("#e-tagin")?.value.trim(); if(pending) addTag(pending);
  const dur=parseDur($("#e-dur").value); if(dur===undefined){ err.textContent="Dauer bitte als mm:ss oder h:mm:ss angeben."; $("#e-dur").focus(); return; }
  const prev=S.videos.get(id)||{}; const now=Date.now();
  const data={ ...prev, id, title:$("#e-title").value.trim(), creator:$("#e-creator").value.trim(), uploadDate:$("#e-upload").value||"",
    duration:dur, genre:$("#e-genre").value, format:$("#e-format").value, mood:$("#e-mood").value, tags:E.tags,
    status:$("#e-status").value, watched:$("#e-watched").checked, notes:$("#e-notes").value.trim(),
    reactsTo:E.reactsTo.filter(x=>x!==id), extOrig:E.ext?.on?{note:(E.ext.note||"").trim(),url:(E.ext.url||"").trim()}:null, channelId:E.channelId||prev.channelId||"", addedAt:prev.addedAt||now, updatedAt:now };
  const newStubs=[...E.stubs.values()].filter(s=>E.reactsTo.includes(s.id)&&!S.videos.has(s.id));
  for(const s of newStubs) S.videos.set(s.id,{...s,updatedAt:now});
  S.videos.set(id,data); S.deleted.delete(id);
  persist(); closeLayer(); render(); toast(E.isNew?"Hinzugefügt":"Gespeichert"); openDrawer(id);
  if(newStubs.length) enrichStubs(newStubs.map(s=>s.id));
}
async function enrichStubs(ids){ // Originale im Hintergrund mit Titel/Creator füllen
  try{ const meta=await fetchMeta(ids); let changed=false;
    for(const [id,m] of meta){ const v=S.videos.get(id); if(!v||v.title) continue;
      S.videos.set(id,{...v,...(m?{title:m.title,creator:m.creator,channelId:m.channelId||v.channelId||"",uploadDate:m.uploadDate||"",duration:m.duration||null,status:m.status}:{status:"Nicht mehr verfügbar"}),updatedAt:Date.now()}); changed=true; }
    if(changed){ persist(); render(); }
  }catch(e){}
}
function updateVideo(id,patch){ const v=S.videos.get(id); if(!v) return; S.videos.set(id,{...v,...patch,updatedAt:Date.now()}); persist(); render(); }
function removeVideo(id){
  S.videos.delete(id); S.deleted.add(id);
  for(const x of [...S.series.values()]) if(x.videoIds.includes(id)) S.series.set(x.id,{...x,videoIds:x.videoIds.filter(i=>i!==id),updatedAt:Date.now()});
  for(const v of [...S.videos.values()]) if((v.reactsTo||[]).includes(id)) S.videos.set(v.id,{...v,reactsTo:v.reactsTo.filter(x=>x!==id),updatedAt:Date.now()});
  persist(); render();
}
